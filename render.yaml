# Render blueprint for the FinRisk dashboard.
# Render clones the repo, runs buildCommand (which regenerates the models + processed
# data from data/raw/ -- they are gitignored), then serves the Flask app with gunicorn.
services:
  - type: web
    name: finrisk
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      cd notebooks &&
      jupyter nbconvert --to notebook --execute --inplace
      01_Data_Understanding.ipynb
      02_EDA_and_Feature_Engineering.ipynb
      03_Model_Training_Evaluation.ipynb
      04_Loan_Recommendation_and_Repayment.ipynb
    startCommand: >-
      gunicorn --chdir dashboard app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_DEBUG
        value: "0"
